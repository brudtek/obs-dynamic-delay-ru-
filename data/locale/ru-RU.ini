Audio.ModeTooltip="«Звук сцены» собирает звук всех видимых источников сцены ожидания, включая вложенные сцены и группы, с их громкостью и отключением звука. Источники, общие с другими сценами, тоже звучат — без удвоения. Отдельный / резервный источник нужен, только если сцена ожидания недоступна или выбран режим «Отдельный источник». «Резервная дорожка» берёт звук с неиспользуемой звуковой дорожки OBS."
